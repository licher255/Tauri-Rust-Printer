<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirPrinter</title>
  </head>

  <body>
    <!-- 自定义标题栏（无边框窗口） -->
    <div id="titlebar" data-tauri-drag-region>
      <div class="titlebar-left">
        <img src="/logo.png" class="titlebar-logo" alt="" />
        <span class="titlebar-title">AirPrinter</span>
      </div>
      <div class="titlebar-controls" id="titlebar-controls">
        <button id="win-min" class="titlebar-btn" data-i18n-title="window.minimize" title="Minimize">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button id="win-max" class="titlebar-btn" data-i18n-title="window.maximize" title="Maximize">
          <i class="fa-regular fa-square"></i>
        </button>
        <button id="win-close" class="titlebar-btn titlebar-close" data-i18n-title="window.close" title="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <main id="content">
      <!-- 打印机列表（组件挂载点） -->
      <div id="printer-list-container"></div>

      <!-- 设置（组件挂载点） -->
      <div id="settings-container"></div>

      <!-- 日志面板（组件挂载点） -->
      <div id="log-panel-container"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
